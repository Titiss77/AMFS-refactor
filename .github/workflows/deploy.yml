name: Deploiement vers ByetHost FTP

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-byethost
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🎉 Déploiement FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v3

      - name: 📦 Nettoyage du vendor (Production)
        # Les commentaires ici sont valides car ils ne sont pas dans un bloc littéral (|)
        working-directory: htdocs
        run: composer install --no-dev --optimize-autoloader

      - name: 📂 Synchronisation FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: /
          state-name: htdocs/.ftp-deploy-sync-state.json
          
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            tests/**
            user_guide_src/**
            phpunit.xml.dist
            .env
            spark
            README.md
            LICENSE
            composer.json
            composer.lock
            vendor/phpunit/**
            vendor/fakerphp/**
            vendor/symfony/**
            vendor/mockery/**
            **/sites_non_lances/
            **/sites_non_lances/**
            writable/cache/**
            writable/cache/FactoriesCache_config
            writable/cache/FileLocatorCache
            writable/logs/**
            writable/session/**