name: Deploiement vers ByetHost FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Déploiement FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v3

      - name: 📦 Nettoyage du vendor (Production)
        # Remplace 'mathis.likesyou.org/htdocs' par le chemin réel si nécessaire
        working-directory: mathis.likesyou.org/htdocs
        run: composer install --no-dev --optimize-autoloader

      - name: 📂 Synchronisation FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: /
          
          state-name: htdocs/.ftp-deploy-sync-state.json
          
          # On ajoute aussi le dossier d'installation de base de Composer et d'autres fichiers inutiles
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            !**/.gitignore
            tests/**
            user_guide_src/**
            phpunit.xml.dist
            .env
            spark
            README.md
            LICENSE
            composer.json
            composer.lock
            vendor/phpunit/**
            vendor/fakerphp/**