name: Deploiement vers ByetHost FTP

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-byethost
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🎉 Déploiement FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v3

      - name: 📦 Préparation de tous les sites (Composer & Cache)
        # On boucle sur tous les dossiers de vos sites pour les préparer
        run: |
          for site in htdocs titiss.space/htdocs etc; do
            if [ -d "$site" ]; then
              echo "Préparation de $site..."
              cd $site
              
              # Installation des dépendances de prod si composer.json existe
              if [ -f "composer.json" ]; then
                composer install --no-dev --optimize-autoloader
              fi
              
              # Nettoyage du cache CI4 si le dossier existe
              if [ -d "writable/cache" ]; then
                rm -rf writable/cache/*
              fi
              
              cd - > /dev/null
            fi
          done

      - name: 📂 Synchronisation FTP Globale
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: /
          state-name: htdocs/.ftp-deploy-sync-state.json
          
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/spark
            **/phpunit.xml.dist
            **/README.md
            **/LICENSE
            **/composer.json
            **/composer.lock
            **/tests/**
            **/user_guide_src/**
            **/vendor/phpunit/**
            **/vendor/fakerphp/**
            **/vendor/symfony/**
            **/vendor/mockery/**
            **/sites_non_lances/**
            **/writable/cache/**
            **/writable/logs/**
            **/writable/session/**