name: Deploiement vers ByetHost FTP

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-byethost
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🎉 Déploiement FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v4

      - name: 📦 Préparation automatique de tous les sites
        run: |
          # Recherche automatique de tous les dossiers contenant un composer.json ou un dossier writable/cache (excluant les vendor)
          find . -maxdepth 3 -name "composer.json" -not -path "*/vendor/*" | while read -r file; do
            site=$(dirname "$file")
            echo "Préparation automatique de $site..."
            cd "$site"
            
            # Installation des dépendances de production
            composer install --no-dev --optimize-autoloader
            
            # Nettoyage du cache s'il existe
            if [ -d "writable/cache" ]; then
              rm -rf writable/cache/*
            fi
            
            cd - > /dev/null
          done

      - name: 📂 Synchronisation FTP Globale
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: ./
          state-name: htdocs/.ftp-deploy-sync-state.json
          
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/spark
            **/phpunit.xml.dist
            **/README.md
            **/LICENSE
            **/composer.json
            **/composer.lock
            **/tests/**
            **/user_guide_src/**
            **/vendor/phpunit/**
            **/vendor/fakerphp/**
            **/vendor/symfony/**
            **/vendor/mockery/**
            **/sites_non_lances/**
            **/writable/cache/**
            **/writable/logs/**
            **/writable/session/**